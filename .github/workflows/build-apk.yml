name: Compilar APK de Agrio

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Caché de Buildozer (acelera futuras compilaciones)
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config m4 \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev python3-setuptools

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Compilar APK Debug con Buildozer
        run: |
          buildozer android debug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: agrio-apk
          path: bin/*.apk
          if-no-files-found: error
